services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: domino
      POSTGRES_PASSWORD: domino
      POSTGRES_DB: domino
    ports:
      - "5432:5432"
    volumes:
      - domino_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - domino_redis_data:/data

volumes:
  domino_postgres_data:
  domino_redis_data:
